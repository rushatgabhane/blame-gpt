modules:
  trigger:
    - key: blamegpt-pr-comment-trigger
      function: main
      events:
        - avi:bitbucket:created:pullrequest-comment
        - avi:bitbucket:updated:pullrequest-comment
  function:
    - key: main
      handler: index.run
permissions:
  scopes:
    - read:pullrequest:bitbucket
  external:
    fetch:
      backend:
        # replace with your BlameGPT server domain
        - blamegpt.example.com
app:
  runtime:
    name: nodejs22.x
  # generated by `forge register`
  id: replace-me
