[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["**/*.ipynb", "**venv/"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "TID", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
files = ["libs"]
exclude = ["data/"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["apscheduler.*", "yoyo.*"]
ignore_missing_imports = true
