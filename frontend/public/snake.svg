<svg width="40" height="55" xmlns="http://www.w3.org/2000/svg">
  <style>
    .snake {
      fill: #6f908b;
      opacity: 0;
      animation: snake 1.2s infinite linear;
    }
    
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: -0.2s; }
    .s3 { animation-delay: -0.4s; }
    .s4 { animation-delay: -0.6s; }
    .s5 { animation-delay: -0.8s; }
    .s6 { animation-delay: -1.0s; }
    
    @keyframes snake {
      0%, 66.6% { opacity: 1; }
      66.7%, 100% { opacity: 0; }
    }
  </style>
  
  <!-- Snake segments only -->
  <rect class="snake s1" x="5" y="5" width="10" height="10"/>     <!-- top-left -->
  <rect class="snake s2" x="5" y="25" width="10" height="10"/>    <!-- mid-left -->
  <rect class="snake s3" x="5" y="45" width="10" height="10"/>    <!-- bot-left -->
  <rect class="snake s4" x="25" y="45" width="10" height="10"/>   <!-- bot-right -->
  <rect class="snake s5" x="25" y="25" width="10" height="10"/>   <!-- mid-right -->
  <rect class="snake s6" x="25" y="5" width="10" height="10"/>    <!-- top-right -->
</svg>