name: Check lint with Black

on:
  push:
    branches: [ main ]
  pull_request:


jobs:
  black:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
     
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Run Black in check-only mode
        run: black --check .
