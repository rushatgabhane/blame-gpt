name: 'CLA Assistant'
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          # This token is required only if you want to store the signatures in a different repository (optional)
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/rushatgabhane/blame-gpt/blob/main/CLA.md' # e.g. a CLA or a DCO document
          # branch should not be protected
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot]'

          # the followings are the optional inputs - If the optional inputs are not given, then default values will be taken
          remote-organization-name: 'Blame-GPT'
          remote-repository-name: 'CLA'
          path-to-signatures: 'signatures/version1/cla.json'
          #custom-notsigned-prcomment: 'Thank you for your submission! We really appreciate it. Like many open source projects, we ask that you sign our [Contributor License Agreement](https://github.com/Blame-GPT/CLA) before we can accept your contribution.'
          #custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          #custom-allsigned-prcomment: 'All Contributors have signed the CLA.'
          #lock-pullrequest-aftermerge: false - if you don't want this bot to automatically lock the pull request after merging (default - true)
          #use-dco-flag: true - If you are using DCO instead of CLA
